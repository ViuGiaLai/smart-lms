services:
  # Database PostgreSQL với pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart_lms_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-smart_lms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Background Tasks queue
  redis:
    image: redis:7-alpine
    container_name: smart_lms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # FastAPI Backend Service (Core LMS API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_lms_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-smart_lms}
      - REDIS_URL=redis://redis:6379/0
      # AI Service chạy nội bộ trong mạng Compose (không publish ra host).
      # Nếu muốn AI chạy riêng trên host, đặt AI_SERVICE_URL=http://host.docker.internal:8001 trong .env
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8001}
      # Khóa nội bộ: phải TRÙNG với INTERNAL_API_KEY của ai-service
      - AI_SERVICE_INTERNAL_KEY=${INTERNAL_API_KEY:-smart_lms_internal_dev_key_change_me}
      # BẢO MẬT: đặt SECRET_KEY trong file .env (>= 32 ký tự ngẫu nhiên) trước khi triển khai thực tế.
      - SECRET_KEY=${SECRET_KEY:-dev_insecure_secret_change_in_production_0123456789}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_started
    volumes:
      - ./backend:/app

  # Python AI Service (RAG, Gemini LLM, pgvector search, Quiz Generator)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smart_lms_ai_service
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-smart_lms}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Khóa nội bộ: chỉ Backend (cùng mạng) mới gọi được AI Service
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-smart_lms_internal_dev_key_change_me}
      - PORT=8001
    # KHÔNG publish ra host: AI Service chỉ truy cập nội bộ từ Backend qua mạng Compose.
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai-service:/app

  # Next.js 14 Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_lms_frontend
    restart: always
    environment:
      # Không thêm hậu tố /api/v1: mã nguồn frontend (lib/api.ts) đã tự ghép /api/v1/...
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXTAUTH_URL=http://localhost:3000
      # BẢO MẬT: đặt NEXTAUTH_SECRET trong file .env trước khi triển khai thực tế.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev_insecure_nextauth_secret_change_in_prod_0123456789}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
